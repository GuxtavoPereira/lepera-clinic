<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vida Clara — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3accc0;
    --ink-soft:#5E766F;
    --bg:#F3F6F1;
    --surface:#FFFFFF;
    --surface-tint:#E9F0E4;
    --brand:#52b4ae;
    --brand-deep:#3d948e;
    --accent:#D65F4C;
    --line:#D8E1D3;
    --danger:#B84A39;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDF3EF;
      --ink-soft:#94A9A1;
      --bg:#3999b1;
      --surface:#268f88;
      --surface-tint:#208a83;
      --brand:#74B8A5;
      --brand-deep:#8FCDBB;
      --accent:#E8836F;
      --line:#28372F;
      --danger:#F2A491;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDF3EF;
    --ink-soft:#94A9A1;
    --bg:#3ab8a3;
    --surface:#1b857e;
    --surface-tint:#3c9494;
    --brand:#74B8A5;
    --brand-deep:#8FCDBB;
    --accent:#E8836F;
    --line:#28372F;
    --danger:#F2A491;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  .screen{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }

  /* top curved brand panel */
  .brandpanel{
    background:var(--brand-deep);
    padding:52px 30px 46px;
    position:relative;
    overflow:hidden;
    border-radius:0 0 32px 32px;
  }
  .brandpanel::after{
    content:"";
    position:absolute;
    width:220px;height:220px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    top:-110px; right:-70px;
  }
  .brandpanel::before{
    content:"";
    position:absolute;
    width:140px;height:140px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.10);
    bottom:-60px; left:-40px;
  }
  .crest{
    width:44px;height:44px;
    margin-bottom:18px;
    position:relative;
  }
  .brandpanel h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:27px;
    color:#F7FAF6;
    margin:0 0 8px;
    position:relative;
    max-width:14ch;
  }
  .brandpanel p{
    font-size:13.5px;
    color:rgba(247,250,246,0.72);
    margin:0;
    position:relative;
    max-width:30ch;
    line-height:1.5;
  }

  /* form card */
  .formwrap{
    flex:1;
    padding:30px 26px 40px;
    display:flex;
    flex-direction:column;
  }

  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  .field .input-shell{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px 14px;
  }
  .field .input-shell svg{
    width:17px;height:17px;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .field input{
    border:none;
    outline:none;
    background:transparent;
    font-family:var(--font-body);
    font-size:14.5px;
    color:var(--ink);
    width:100%;
  }
  .field input::placeholder{color:#9AACA4;}
  .field.focused .input-shell{
    border-color:var(--brand);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
  }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:2px 0 26px;
  }
  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .checkbox{
    width:18px;height:18px;
    border-radius:6px;
    border:1.5px solid var(--line);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .checkbox.checked{
    background:var(--brand);
    border-color:var(--brand);
  }
  .checkbox svg{width:11px;height:11px;color:#fff;}
  .forgot{
    font-size:13px;
    font-weight:600;
    color:var(--brand);
  }

  .btn-primary{
    width:100%;
    background:var(--accent);
    color:#FFF8F5;
    border:none;
    border-radius:13px;
    padding:16px 18px;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:22px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
  }
  .divider .line{flex:1;height:1px;background:var(--line);}
  .divider span{font-size:12px;color:var(--ink-soft);}

  .alt-actions{
    display:flex;
    gap:12px;
    margin-bottom:auto;
  }
  .alt-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:13px;
    padding:13px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
  }
  .alt-btn svg{width:18px;height:18px;flex-shrink:0;}

  .signup{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-soft);
    padding-top:28px;
  }
  .signup b{color:var(--brand);font-weight:700;}
</style>
</head>
<body>
<div class="screen">

  <div class="brandpanel">
    <svg class="crest" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="15" stroke="#F7FAF6" stroke-width="1.3" opacity="0.5"/>
      <path d="M16 9v14M9 16h14" stroke="#F7FAF6" stroke-width="2.3" stroke-linecap="round"/>
    </svg>
    <h1>Bem-vindo de volta à Leperapia Clinic</h1>
    <p>Entre para acompanhar consultas, exames e sua equipe de cuidado.</p>
  </div>

  <div class="formwrap">

    <div class="field focused">
      <label for="email">E-mail</label>
      <div class="input-shell">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <input id="email" type="email" placeholder="voce@email.com" value="ana.paula@email.com">
      </div>
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <div class="input-shell">
        <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 018 0v2.5" stroke="currentColor" stroke-width="1.6"/></svg>
        <input id="senha" type="password" placeholder="••••••••" value="••••••••">
        <svg viewBox="0 0 24 24" fill="none" style="margin-left:auto"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/></svg>
      </div>
    </div>

    <div class="row-between">
      <div class="remember">
        <div class="checkbox checked"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        Manter conectado
      </div>
      <span class="forgot">Esqueci a senha</span>
    </div>

    <button class="btn-primary">
      Entrar
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="divider"><div class="line"></div><span>ou continue com</span><div class="line"></div></div>

    <div class="alt-actions">
      <div class="alt-btn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.6 12.2c0-.7-.06-1.4-.18-2H12v3.8h5.4a4.6 4.6 0 01-2 3v2.5h3.2c1.9-1.75 3-4.35 3-7.3z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 .95-3.4.95-2.6 0-4.8-1.75-5.6-4.1H3.1v2.6C4.7 19.7 8.1 22 12 22z" fill="#34A853"/><path d="M6.4 13.95a6 6 0 010-3.9V7.45H3.1a10 10 0 000 9.1l3.3-2.6z" fill="#FBBC05"/><path d="M12 6.05c1.5 0 2.8.5 3.85 1.5l2.85-2.85C16.95 2.9 14.7 2 12 2 8.1 2 4.7 4.3 3.1 7.45l3.3 2.6c.8-2.35 3-4 5.6-4z" fill="#EA4335"/></svg>
        Google
      </div>
      <div class="alt-btn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 3v3.5a3 3 0 003 3 3 3 0 003-3V3M6 21v-3.5a3 3 0 013-3h6a3 3 0 013 3V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="7" y="10" width="10" height="4" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        Face ID
      </div>
    </div>

    <p class="signup">Ainda não tem cadastro? <b>Criar conta</b></p>
  </div>

</div>
</body>
</html>
