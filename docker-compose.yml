services:
  mysql:
    image: mysql:8.4
    container_name: lepera-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: lepera_db
    ports:
      - "3306:3306"
    volumes:
      - lepera_mysql_data:/var/lib/mysql

volumes:
  lepera_mysql_data: