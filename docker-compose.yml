services:
  postgres:
    image: postgres:17-alpine
    container_name: lepera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lepera
      POSTGRES_PASSWORD: lepera_dev
      POSTGRES_DB: lepera_db
    ports:
      - "5432:5432"
    volumes:
      - lepera_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lepera -d lepera_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lepera_postgres_data: